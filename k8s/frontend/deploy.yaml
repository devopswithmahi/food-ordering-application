apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: umamaheswaritalupuri/frontend:v1
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_URL
          value: backend-service:3000

